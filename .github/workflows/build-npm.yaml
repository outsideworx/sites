name: Build NPM
on:
  push:
    branches: [main]
  repository_dispatch:
    types:
      - build-tunde-divat
jobs:
  build-sites:
    if: github.event_name == 'push'
    runs-on: self-hosted
    strategy:
      matrix:
        name:
          - tunde-divat
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DISPATCH_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v6
        with:
          build-args: NAME=${{ matrix.name }}
          context: .
          file: Dockerfile.npm
          no-cache: true
          push: true
          tags: ghcr.io/outsideworx/${{ matrix.name }}:latest
  build:
    if: github.event_name == 'repository_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DISPATCH_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v6
        with:
          build-args: NAME=${{ github.event.client_payload.name }}
          context: .
          file: Dockerfile.npm
          no-cache: true
          push: true
          tags: ghcr.io/outsideworx/${{ github.event.client_payload.name }}:latest
