name: Build
on:
  push:
    branches: [main]
  repository_dispatch:
    types:
      - build-come-in-and-find-out
      - build-duckumbrella
      - build-gaiapeeps
      - build-igli
      - build-outsideworx
      - build-soupart
      - build-soupkitchen
      - build-tunde-divat
jobs:
  build-sites:
    if: github.event_name == 'push'
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - name: come-in-and-find-out
          - name: duckumbrella
          - name: gaiapeeps
          - name: igli
          - name: outsideworx
          - name: soupart
          - name: soupkitchen
          - name: tunde-divat
            type: npm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DISPATCH_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v6
        with:
          build-args: NAME=${{ matrix.name }}
          context: .
          file: Dockerfile${{ matrix.type && format('.{0}', matrix.type) || '' }}
          no-cache: true
          push: true
          tags: ghcr.io/outsideworx/${{ matrix.name }}:latest
  build:
    if: github.event_name == 'repository_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.DISPATCH_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v6
        with:
          build-args: NAME=${{ github.event.client_payload.name }}
          context: .
          file: Dockerfile${{ github.event.client_payload.type && format('.{0}', github.event.client_payload.type) || '' }}
          no-cache: true
          push: true
          tags: ghcr.io/outsideworx/${{ github.event.client_payload.name }}:latest
      - run: docker service update --force --with-registry-auth --image ghcr.io/outsideworx/${{ github.event.client_payload.name }}:latest sites_${{ github.event.client_payload.name }}
