name: Build

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [build-site]

jobs:
  build-all:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name:
          - come-in-and-find-out
          - duckumbrella
          - gaiapeeps
          - igli
          - outsideworx
          - soupart
          - soupkitchen
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/outsideworx/${{ matrix.name }}:latest
          build-args: NAME=${{ matrix.name }}

  build-one:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/outsideworx/${{ github.event.client_payload.name }}:latest
          build-args: NAME=${{ github.event.client_payload.name }}
