name: Deploy
on:
  workflow_dispatch:
    inputs:
      flags:
        default: ''
        description: 'Flags to pass to deploy.sh'
        required: false
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo "${{ secrets.ENV }}" > .env
          ./deploy.sh "${{ github.event.inputs.flags }}"
