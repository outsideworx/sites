name: Deploy
on:
  workflow_dispatch:
    inputs:
      flags:
        description: 'Optional flags to pass to deploy.sh (e.g. --install)'
        required: false
        default: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: services.outsideworx.net
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd src/sites
            git pull
            bash deploy.sh ${{ github.event.inputs.flags }}
