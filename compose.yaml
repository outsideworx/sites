x-healthcheck: &healthcheck
  healthcheck:
    interval: 1m
    retries: 2
    start_period: 1m
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/metrics"]
    timeout: 30s
x-networks: &networks
  networks:
    outsideworx:
x-placement: &placement
  placement:
    constraints:
      - node.role == manager
x-update-config: &update_config
  update_config:
    failure_action: rollback
    order: start-first
networks:
  edge:
    external: true
  outsideworx:
    external: true
services:
  come-in-and-find-out:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.come-in-and-find-out.entrypoints=websecure
        - traefik.http.routers.come-in-and-find-out.middlewares=www-redirect
        - traefik.http.routers.come-in-and-find-out.rule=Host(`come-in-and-find-out.ch`) || Host(`www.come-in-and-find-out.ch`)
        - traefik.http.routers.come-in-and-find-out.tls.certresolver=letsencrypt
        - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.come-in-and-find-out.loadbalancer.server.port=80
    environment:
      TOKEN: $APP_CLIENTS_CIAFO_TOKEN
    image: ghcr.io/outsideworx/come-in-and-find-out:latest
    volumes:
      - services_cache:/usr/local/apache2/htdocs/cache:ro
  duckumbrella:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.duckumbrella.entrypoints=websecure
        - traefik.http.routers.duckumbrella.middlewares=www-redirect
        - traefik.http.routers.duckumbrella.rule=Host(`duckumbrella.net`) || Host(`www.duckumbrella.net`)
        - traefik.http.routers.duckumbrella.tls.certresolver=letsencrypt
        - traefik.http.services.duckumbrella.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.duckumbrella.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.duckumbrella.loadbalancer.server.port=80
    image: ghcr.io/outsideworx/duckumbrella:latest
  gaiapeeps:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.gaiapeeps.entrypoints=websecure
        - traefik.http.routers.gaiapeeps.middlewares=www-redirect
        - traefik.http.routers.gaiapeeps.rule=Host(`gaiapeeps.com`) || Host(`www.gaiapeeps.com`)
        - traefik.http.routers.gaiapeeps.tls.certresolver=letsencrypt
        - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.gaiapeeps.loadbalancer.server.port=80
    environment:
      TOKEN: $APP_CLIENTS_PEEPS_TOKEN
    image: ghcr.io/outsideworx/gaiapeeps:latest
  igli:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.igli.entrypoints=websecure
        - traefik.http.routers.igli.middlewares=www-redirect
        - traefik.http.routers.igli.rule=Host(`igli.info`) || Host(`www.igli.info`)
        - traefik.http.routers.igli.tls.certresolver=letsencrypt
        - traefik.http.services.igli.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.igli.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.igli.loadbalancer.server.port=80
    image: ghcr.io/outsideworx/igli:latest
  outsideworx:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.middlewares.www-redirect.redirectregex.permanent=true
        - traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\.(.+)
        - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}
        - traefik.http.routers.outsideworx.entrypoints=websecure
        - traefik.http.routers.outsideworx.middlewares=www-redirect
        - traefik.http.routers.outsideworx.rule=Host(`outsideworx.net`) || Host(`www.outsideworx.net`)
        - traefik.http.routers.outsideworx.tls.certresolver=letsencrypt
        - traefik.http.services.outsideworx.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.outsideworx.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.outsideworx.loadbalancer.server.port=80
    environment:
      CLIENT_SECRET: $APP_CLIENTS_THEGREEN_SECRET
      CLIENT_SECRET_PATH: /clients/thegreen/
      TOKEN: $APP_CLIENTS_WORX_TOKEN
    image: ghcr.io/outsideworx/outsideworx:latest
  soupart:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.soupart.entrypoints=websecure
        - traefik.http.routers.soupart.middlewares=www-redirect
        - traefik.http.routers.soupart.rule=Host(`soupart.net`) || Host(`www.soupart.net`)
        - traefik.http.routers.soupart.tls.certresolver=letsencrypt
        - traefik.http.services.soupart.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.soupart.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.soupart.loadbalancer.server.port=80
    environment:
      TOKEN: $APP_CLIENTS_SOUP_TOKEN
    image: ghcr.io/outsideworx/soupart:latest
    volumes:
      - services_cache:/usr/local/apache2/htdocs/cache:ro
  soupkitchen:
    <<: *healthcheck
    <<: *networks
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.soupkitchen.entrypoints=websecure
        - traefik.http.routers.soupkitchen.middlewares=www-redirect
        - traefik.http.routers.soupkitchen.rule=Host(`soupkitchen.info`) || Host(`www.soupkitchen.info`)
        - traefik.http.routers.soupkitchen.tls.certresolver=letsencrypt
        - traefik.http.services.soupkitchen.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.soupkitchen.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.soupkitchen.loadbalancer.server.port=80
    image: ghcr.io/outsideworx/soupkitchen:latest
  tunde-divat:
    <<: *healthcheck
    deploy:
      <<: *placement
      <<: *update_config
      labels:
        - traefik.enable=true
        - traefik.http.routers.tunde-divat.entrypoints=websecure
        - traefik.http.routers.tunde-divat.rule=Host(`tundedivat.com`)
        - traefik.http.routers.tunde-divat.tls.certresolver=letsencrypt
        - traefik.http.services.tunde-divat.loadbalancer.healthcheck.interval=1m
        - traefik.http.services.tunde-divat.loadbalancer.healthcheck.path=/metrics
        - traefik.http.services.tunde-divat.loadbalancer.server.port=80
    environment:
      AI_PROVIDER: $TUNDE_DIVAT_AI_PROVIDER
      CORS_ORIGIN: https://tundedivat.com
      DATABASE_URL: file:/data/tunde-divat.db
      OPENAI_API_KEY: $TUNDE_DIVAT_OPENAI_API_KEY
      SEED_ADMIN_PASSWORD: $TUNDE_DIVAT_SEED_ADMIN_PASSWORD
      SEED_ADMIN_USERNAME: $TUNDE_DIVAT_SEED_ADMIN_USERNAME
      SEED_INVITE_CODE: $TUNDE_DIVAT_SEED_INVITE_CODE
      SESSION_SECRET: $TUNDE_DIVAT_SESSION_SECRET
      UPLOAD_DIR: /data/uploads
    image: ghcr.io/outsideworx/tunde-divat:latest
    networks:
      edge:
    volumes:
      - tunde-divat:/data
volumes:
  services_cache:
    external: true
  tunde-divat:
