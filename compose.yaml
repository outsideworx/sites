networks:
  services_default:
    external: true
services:
  come-in-and-find-out:
    build:
      args:
        NAME: come-in-and-find-out
        TOKEN: $APP_CLIENTS_CIAFO_TOKEN
    container_name: come-in-and-find-out
    labels:
      - traefik.enable=true
      - traefik.http.routers.come-in-and-find-out.rule=Host(`come-in-and-find-out.ch`)
      - traefik.http.routers.come-in-and-find-out.entrypoints=websecure
      - traefik.http.routers.come-in-and-find-out.tls.certresolver=letsencrypt
      - traefik.http.services.come-in-and-find-out.loadbalancer.server.port=81
    networks:
      - services_default
    restart: unless-stopped
  duckumbrella:
    build:
      args:
        NAME: duckumbrella
    container_name: duckumbrella
    labels:
      - traefik.enable=true
      - traefik.http.routers.duckumbrella.rule=Host(`duckumbrella.net`)
      - traefik.http.routers.duckumbrella.entrypoints=websecure
      - traefik.http.routers.duckumbrella.tls.certresolver=letsencrypt
      - traefik.http.services.duckumbrella.loadbalancer.server.port=81
