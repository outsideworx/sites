x-healthcheck: &healthcheck
  interval: 5s
  retries: 2
  start_period: 1m
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/metrics"]
  timeout: 30s
networks:
  services_default:
    external: true
services:
  come-in-and-find-out:
    build:
      args:
        NAME: come-in-and-find-out
      dockerfile: Dockerfile.test
    container_name: come-in-and-find-out
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.come-in-and-find-out.entrypoints=websecure
      - traefik.http.routers.come-in-and-find-out.rule=Host(`come-in-and-find-out.localhost`)
      - traefik.http.routers.come-in-and-find-out.tls=true
      - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
    volumes:
      - services_cache:/usr/local/apache2/htdocs/cache:ro
  duckumbrella:
    build:
      args:
        NAME: duckumbrella
      dockerfile: Dockerfile.test
    container_name: duckumbrella
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.duckumbrella.entrypoints=websecure
      - traefik.http.routers.duckumbrella.rule=Host(`duckumbrella.localhost`)
      - traefik.http.routers.duckumbrella.tls=true
      - traefik.http.services.duckumbrella.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.duckumbrella.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
  gaiapeeps:
    build:
      args:
        NAME: gaiapeeps
      dockerfile: Dockerfile.test
    container_name: gaiapeeps
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.gaiapeeps.entrypoints=websecure
      - traefik.http.routers.gaiapeeps.rule=Host(`gaiapeeps.localhost`)
      - traefik.http.routers.gaiapeeps.tls=true
      - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
  igli:
    build:
      args:
        NAME: igli
      dockerfile: Dockerfile.test
    container_name: igli
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.igli.entrypoints=websecure
      - traefik.http.routers.igli.rule=Host(`igli.localhost`)
      - traefik.http.routers.igli.tls=true
      - traefik.http.services.igli.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.igli.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
  outsideworx:
    build:
      args:
        NAME: outsideworx
      dockerfile: Dockerfile.test
    container_name: outsideworx
    environment:
      CLIENT_SECRET: green007
      CLIENT_SECRET_PATH: /clients/thegreen/
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.outsideworx.entrypoints=websecure
      - traefik.http.routers.outsideworx.rule=Host(`outsideworx.localhost`)
      - traefik.http.routers.outsideworx.tls=true
      - traefik.http.services.outsideworx.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.outsideworx.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
  soupart:
    build:
      args:
        NAME: soupart
      dockerfile: Dockerfile.test
    container_name: soupart
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.soupart.entrypoints=websecure
      - traefik.http.routers.soupart.rule=Host(`soupart.localhost`)
      - traefik.http.routers.soupart.tls=true
      - traefik.http.services.soupart.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.soupart.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
    volumes:
      - services_cache:/usr/local/apache2/htdocs/cache:ro
  soupkitchen:
    build:
      args:
        NAME: soupkitchen
      dockerfile: Dockerfile.test
    container_name: soupkitchen
    healthcheck:
      <<: *healthcheck
    labels:
      - traefik.enable=true
      - traefik.http.routers.soupkitchen.entrypoints=websecure
      - traefik.http.routers.soupkitchen.rule=Host(`soupkitchen.localhost`)
      - traefik.http.routers.soupkitchen.tls=true
      - traefik.http.services.soupkitchen.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.soupkitchen.loadbalancer.healthcheck.path=/metrics
    networks:
      - services_default
  tunde-divat:
    build:
      args:
        NAME: tunde-divat
      dockerfile: Dockerfile.npm.test
    container_name: tunde-divat
    environment:
      CORS_ORIGIN: https://tunde-divat.localhost
      DATABASE_URL: file:/data/tunde-divat.db
      SESSION_SECRET: test-session-secret-at-least-32-characters
      UPLOAD_DIR: /data/uploads
    healthcheck:
      interval: 5s
      retries: 2
      start_period: 1m
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      timeout: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.tunde-divat.entrypoints=websecure
      - traefik.http.routers.tunde-divat.rule=Host(`tunde-divat.localhost`)
      - traefik.http.routers.tunde-divat.tls=true
      - traefik.http.services.tunde-divat.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.tunde-divat.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.tunde-divat.loadbalancer.server.port=4000
    networks:
      - services_default
volumes:
  services_cache:
    external: true
