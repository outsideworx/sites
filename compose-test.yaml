x-healthcheck: &healthcheck
  healthcheck:
    interval: 5s
    retries: 2
    start_period: 1m
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/metrics"]
    timeout: 30s
x-networks: &networks
  networks:
    services_default:
networks:
  services_default:
    external: true
services:
  come-in-and-find-out:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: come-in-and-find-out
      dockerfile: Dockerfile.test
    container_name: come-in-and-find-out
    labels:
      - traefik.enable=true
      - traefik.http.routers.come-in-and-find-out.entrypoints=websecure
      - traefik.http.routers.come-in-and-find-out.middlewares=compress
      - traefik.http.routers.come-in-and-find-out.rule=Host(`come-in-and-find-out.localhost`)
      - traefik.http.routers.come-in-and-find-out.tls=true
      - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.come-in-and-find-out.loadbalancer.healthcheck.path=/metrics
    volumes:
      - services_cache:/usr/local/apache2/htdocs/cache:ro
  duckumbrella:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: duckumbrella
      dockerfile: Dockerfile.test
    container_name: duckumbrella
    labels:
      - traefik.enable=true
      - traefik.http.routers.duckumbrella.entrypoints=websecure
      - traefik.http.routers.duckumbrella.middlewares=compress
      - traefik.http.routers.duckumbrella.rule=Host(`duckumbrella.localhost`)
      - traefik.http.routers.duckumbrella.tls=true
      - traefik.http.services.duckumbrella.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.duckumbrella.loadbalancer.healthcheck.path=/metrics
  gaiapeeps:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: gaiapeeps
      dockerfile: Dockerfile.test
    container_name: gaiapeeps
    labels:
      - traefik.enable=true
      - traefik.http.routers.gaiapeeps.entrypoints=websecure
      - traefik.http.routers.gaiapeeps.middlewares=compress
      - traefik.http.routers.gaiapeeps.rule=Host(`gaiapeeps.localhost`)
      - traefik.http.routers.gaiapeeps.tls=true
      - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.gaiapeeps.loadbalancer.healthcheck.path=/metrics
  igli:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: igli
      dockerfile: Dockerfile.test
    container_name: igli
    labels:
      - traefik.enable=true
      - traefik.http.routers.igli.entrypoints=websecure
      - traefik.http.routers.igli.middlewares=compress
      - traefik.http.routers.igli.rule=Host(`igli.localhost`)
      - traefik.http.routers.igli.tls=true
      - traefik.http.services.igli.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.igli.loadbalancer.healthcheck.path=/metrics
  outsideworx:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: outsideworx
      dockerfile: Dockerfile.test
    container_name: outsideworx
    environment:
      CLIENT_SECRET: green007
      CLIENT_SECRET_PATH: /clients/thegreen/
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.compress.compress.includedcontenttypes=text/css,text/html,text/javascript,text/plain,application/javascript,application/json,image/svg+xml
      - traefik.http.routers.outsideworx.entrypoints=websecure
      - traefik.http.routers.outsideworx.middlewares=compress
      - traefik.http.routers.outsideworx.rule=Host(`outsideworx.localhost`)
      - traefik.http.routers.outsideworx.tls=true
      - traefik.http.services.outsideworx.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.outsideworx.loadbalancer.healthcheck.path=/metrics
  soupart:
    <<: [*healthcheck, *networks]
    build:
      args:
        NAME: soupart
      dockerfile: Dockerfile.test
    container_name: soupart
    labels:
      - traefik.enable=true
      - traefik.http.routers.soupart.entrypoints=websecure
      - traefik.http.routers.soupart.middlewares=compress
      - traefik.http.routers.soupart.rule=Host(`soupart.localhost`)
